name: Booker

# Triggered hourly by the cf-trigger Cloudflare Worker. The scheduler queries the
# ClassPass schedule API to decide whether to book now, wait until the release
# moment within this hour, or flag the target for cancellation polling.

on:
  # Primary trigger: Cloudflare Worker (`cf-trigger/`) fires `repository_dispatch`
  # every hour. CF crons are reliable to within a minute; GHA `schedule:` crons
  # can be delayed 25min to several hours on small repos.
  repository_dispatch:
    types: [midnight-booker]
  # Backup trigger in case the CF Worker fails. Same hourly cadence.
  # Keep until the Worker path has proven reliable for several weeks.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Serialize runs. A run that's sleeping until a release moment can be still
# in-flight when the next hourly cron fires; without this, the new run would
# race the sleeping one and both try to book. With concurrency, the second
# run queues, then starts after the first commits its targets.json update,
# at which point the booked target is gone and the second run is a no-op.
concurrency:
  group: classpass-booker
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    # 150min accommodates the EST winter case: workflow fires at 10pm EST and
    # sleeps ~2hr until venue-local midnight before booking.
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Attempt booking
        run: python scheduler.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          CLASSPASS_AUTH_TOKEN: ${{ secrets.CLASSPASS_AUTH_TOKEN }}
          CLASSPASS_USER_ID: ${{ secrets.CLASSPASS_USER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_EVENT_COLOR: ${{ secrets.GOOGLE_EVENT_COLOR }}
      - name: Commit updated targets.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add targets.json
          git diff --staged --quiet || (git commit -m "chore: update targets after booking attempt" && git push)
